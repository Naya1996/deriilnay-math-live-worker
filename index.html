
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERiiLNAY MATH LIVE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050713;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px 10px;
  background: linear-gradient(120deg,#080d27,#241052);
  border-bottom: 2px solid #00eaff;
}

header h1 {
  margin: 0;
  color: #00eaff;
  font-size: 25px;
  text-shadow: 0 0 15px #00eaff;
}

header p {
  color: #bd9cff;
  font-size: 12px;
  letter-spacing: 3px;
}

.container {
  padding: 15px;
  max-width: 700px;
  margin: auto;
}

.live-screen {
  background: linear-gradient(145deg,#101a36,#170d31);
  border: 2px solid #8c39ff;
  border-radius: 18px;
  padding: 25px 12px;
  text-align: center;
  box-shadow: 0 0 20px #6020aa55;
}

.live-label {
  color: #ff3c75;
  font-weight: bold;
  letter-spacing: 3px;
}

.level {
  color: #00eaff;
  margin-top: 20px;
  font-size: 14px;
}

.question {
  font-size: clamp(32px,9vw,55px);
  font-weight: bold;
  margin: 28px 0;
  color: white;
  text-shadow: 0 0 15px #00cfff;
  overflow-wrap: anywhere;
}

.timer {
  font-size: 40px;
  color: #ffe600;
  font-weight: bold;
}

.answer {
  display: none;
  color: #00ff99;
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}

.control {
  background: #10162b;
  border: 1px solid #263c68;
  border-radius: 15px;
  margin-top: 18px;
  padding: 18px;
}

.control h3 {
  color: #00eaff;
  text-align: center;
}

button, select, input {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border-radius: 9px;
  border: 1px solid #00d9ff;
  background: #101c35;
  color: white;
  font-size: 15px;
}

button {
  background: linear-gradient(100deg,#075cba,#7928ca);
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.next {
  background: linear-gradient(100deg,#00a878,#006bce);
}

.reveal {
  background: linear-gradient(100deg,#b42d9b,#6624c9);
}

.score {
  text-align: center;
  color: #ffe600;
  font-size: 22px;
  margin: 12px;
}

footer {
  text-align: center;
  color: #687b9e;
  padding: 20px;
  font-size: 11px;
}
 
/* DERiiLNAY MATH LIVE 2.0 */

body.live-mode .control {
  display: none;
}

#hostToggle {
  position: fixed;
  right: 12px;
  bottom: 18px;
  z-index: 9999;
  width: auto;
  padding: 12px 16px;
  border: 1px solid #00eaff;
  border-radius: 30px;
  background: #10162b;
  color: #00eaff;
  box-shadow: 0 0 15px #00eaff88;
  font-size: 12px;
}
/* LIVE SCOREBOARD */

.scoreboard {
  background: #10162b;
  border: 1px solid #00eaff;
  border-radius: 15px;
  padding: 15px;
  margin: 20px auto;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 0 15px #00eaff55;
  color: white;
  text-align: center;
}

.scoreboard h2 {
  color: #00eaff;
  text-shadow: 0 0 10px #00eaff;
}

#rankingList p {
  padding: 8px;
  border-bottom: 1px solid #ffffff22;
} 
</style>
</head>

<body>

<header>
  <h1>DERiiLNAY MATH LIVE</h1>
  <p>MATHEMATICS CHALLENGE</p>
</header>

<div class="container">

  <section class="live-screen">
    <div class="live-label">● LIVE CHALLENGE</div>

    <div class="level" id="level">
      LEVEL 01 - EASY
    </div>

    <div class="question" id="question">
      15 × 8 = ?
    </div>

    <div class="timer" id="timer">20</div>
    <div class="answer" id="answer"></div>
    <div id="status">JAWAB DI KOMENTAR!</div>
  </section>

  <section class="control">
    <h3>HOST CONTROL PANEL</h3>

    <button onclick="startTimer()">▶ MULAI TIMER</button>

    <button class="reveal" onclick="showAnswer()">
      LIHAT JAWABAN
    </button>

    <button class="next" onclick="nextQuestion()">
      SOAL BERIKUTNYA →
    </button>

    <button onclick="resetTimer()">
      RESET TIMER
    </button>

    <select id="difficulty" onchange="nextQuestion()">
      <option value="easy">Mudah</option>
      <option value="medium">Menengah</option>
      <option value="hard">Sulit</option>
      <option value="extreme">Ekstrem</option>
    </select>
  </section>

  <section class="control">
    <h3>PARTICIPANT SCORE</h3>

    <input id="player" placeholder="Nama peserta">

    <button onclick="addScore()">+ TAMBAH 10 POIN</button>

    <div class="score" id="score">
      TOTAL SKOR: 0
    </div>

    <div id="playerList"></div>
  </section>

</div>

<footer>
  DERiiLNAY DIGITAL PROJECT © 2026
</footer>
  <section class="scoreboard">
  <h2>🏆 LIVE SCOREBOARD</h2>
  <div id="rankingList">
    <p>Belum ada peserta.</p>
  </div>
</section>

<button id="hostToggle" onclick="toggleLiveMode()">
  🎮 AKTIFKAN LIVE MODE
</button>

<button id="fullscreenBtn" onclick="toggleFullscreen()">
  ⛶ FULLSCREEN
</button>

<script>

const questions = {
  easy: [
    {q:"12 + 15 = ?",a:27},
    {q:"45 - 18 = ?",a:27},
    {q:"7 × 8 = ?",a:56},
    {q:"81 ÷ 9 = ?",a:9},
    {q:"25 + 37 = ?",a:62},
    {q:"100 - 46 = ?",a:54},
    {q:"12 × 6 = ?",a:72},
    {q:"144 ÷ 12 = ?",a:12},
    {q:"15 + 25 × 2 = ?",a:65},
    {q:"50 ÷ 5 + 8 = ?",a:18},
    {q:"9² = ?",a:81},
    {q:"5³ = ?",a:125},
    {q:"1/2 + 1/2 = ?",a:1},
    {q:"3/4 - 1/4 = ?",a:0.5},
    {q:"20% dari 100 = ?",a:20},
    {q:"10% dari 250 = ?",a:25},
    {q:"3 × 15 + 5 = ?",a:50},
    {q:"120 ÷ 4 - 10 = ?",a:20},
    {q:"16 + 24 ÷ 6 = ?",a:20},
    {q:"8 × 7 - 12 = ?",a:44},
    {q:"2,5 + 3,5 = ?",a:6},
    {q:"10² - 25 = ?",a:75},
    {q:"200 ÷ 8 = ?",a:25},
    {q:"35% dari 200 = ?",a:70},
    {q:"11 × 11 = ?",a:121}
  ],

  medium: [
    {q:"125 + 275 - 150 = ?",a:250},
    {q:"24 × 15 = ?",a:360},
    {q:"360 ÷ 12 = ?",a:30},
    {q:"15² + 10 = ?",a:235},
    {q:"200 - (15 × 8) = ?",a:80},
    {q:"3/4 × 80 = ?",a:60},
    {q:"2/3 dari 90 = ?",a:60},
    {q:"25% dari 480 = ?",a:120},
    {q:"15% dari 600 = ?",a:90},
    {q:"2,5 × 12 = ?",a:30},
    {q:"1.200 ÷ 15 = ?",a:80},
    {q:"18 × 7 + 24 = ?",a:150},
    {q:"500 - 125 ÷ 5 = ?",a:475},
    {q:"4³ + 6² = ?",a:100},
    {q:"√144 + √81 = ?",a:21},
    {q:"2 : 5 = x : 20. Berapa x?",a:8},
    {q:"Perbandingan 3 : 4, jumlah 56. Bagian pertama?",a:24},
    {q:"5 pekerja selesai 12 hari. 10 pekerja berapa hari?",a:6},
    {q:"Harga Rp200.000 diskon 15%. Harga akhir dalam ribuan?",a:170},
    {q:"1/5 + 2/5 = ? (dalam desimal)",a:0.6},
    {q:"7,5% dari 800 = ?",a:60},
    {q:"2³ × 3² = ?",a:72},
    {q:"1.000 - 25% × 400 = ?",a:900},
    {q:"45 × 12 ÷ 9 = ?",a:60},
    {q:"√625 = ?",a:25}
  ],

  hard: [
    {q:"125 × 16 = ?",a:2000},
    {q:"2⁵ + 3⁴ = ?",a:113},
    {q:"(45 + 35) × 2 ÷ 8 = ?",a:20},
    {q:"1.500 ÷ (25 × 3) = ?",a:20},
    {q:"3/5 dari 450 ditambah 20 = ?",a:290},
    {q:"35% dari 1.200 = ?",a:420},
    {q:"4x + 12 = 40. Berapa x?",a:7},
    {q:"3x - 15 = 30. Berapa x?",a:15},
    {q:"2x + 5 = 25. Berapa x?",a:10},
    {q:"5² + 4³ - 3² = ?",a:80},
    {q:"√1296 = ?",a:36},
    {q:"15% dari 2.400 = ?",a:360},
    {q:"0,75 × 240 = ?",a:180},
    {q:"2/3 ÷ 1/3 = ?",a:2},
    {q:"12,5% dari 640 = ?",a:80},
    {q:"8 pekerja selesai 15 hari. 12 pekerja berapa hari?",a:10},
    {q:"Jarak 180 km ditempuh 3 jam. Kecepatan?",a:60},
    {q:"Kecepatan 60 km/jam selama 2,5 jam. Jarak?",a:150},
    {q:"Keliling persegi sisi 18 cm = ?",a:72},
    {q:"Luas persegi panjang 15 × 12 cm = ?",a:180},
    {q:"Luas segitiga alas 20 cm, tinggi 12 cm = ?",a:120},
    {q:"Luas lingkaran r = 7 cm, π = 22/7 = ?",a:154},
    {q:"Volume kubus sisi 6 cm = ?",a:216},
    {q:"Volume balok 10 × 5 × 4 cm = ?",a:200},
    {q:"Rata-rata 70, 80, 90, 60, 100 = ?",a:80}
  ],

  extreme: [
    {q:"125² - 100² = ?",a:5625},
    {q:"2⁶ × 3³ = ?",a:1728},
    {q:"√2500 + √1600 = ?",a:90},
    {q:"(15² + 20²) ÷ 25 = ?",a:25},
    {q:"5x + 3 = 48. Berapa x?",a:9},
    {q:"3(x + 4) = 36. Berapa x?",a:8},
    {q:"40% dari 750 + 25% dari 400 = ?",a:400},
    {q:"3/5 × 4/5 × 100 = ?",a:48},
    {q:"1.250 ÷ 0,25 = ?",a:5000},
    {q:"0,125 × 800 = ?",a:100},
    {q:"Harga Rp800.000 naik 20%, lalu turun 20%. Harga akhir dalam ribuan?",a:768},
    {q:"Perbandingan A : B = 5 : 7. Jumlah 144. Berapa B?",a:84},
    {q:"Dua angka berjumlah 90 dan selisih 24. Angka terbesar?",a:57},
    {q:"Mobil melaju 72 km/jam selama 45 menit. Jarak?",a:54},
    {q:"Pipa mengisi 120 liter dalam 8 menit. Debit per menit?",a:15},
    {q:"3² × 4³ ÷ 12 = ?",a:48},
    {q:"2,5² + 3,5² = ?",a:18.5},
    {q:"Jika x² = 169 dan x positif, berapa x?",a:13},
    {q:"15! ÷ 14! = ?",a:15},
    {q:"1 + 2 + 3 + ... + 50 = ?",a:1275},
    {q:"Sudut segitiga 45° dan 65°. Sudut ketiga?",a:70},
    {q:"Tangga 13 m, jarak kaki ke dinding 5 m. Tinggi?",a:12},
    {q:"Proyek selesai 1/2 hari pertama dan 1/4 hari kedua. Sisa dalam desimal?",a:0.25},
    {q:"6 mesin menghasilkan 900 produk dalam 5 jam. 10 mesin dalam 4 jam menghasilkan?",a:1200},
    {q:"Tangki 800 liter terisi 3/4, lalu digunakan 125 liter. Sisa?",a:475}
  ]
};


let current = 0;
let seconds = 20;
let interval = null;
let totalScore = 0;
let participants = {};
let playerStreak = {};

function getQuestions() {
  return questions[document.getElementById("difficulty").value];
}

function displayQuestion() {
  const list = getQuestions();
  current = current % list.length;

  document.getElementById("question").textContent = list[current].q;
  document.getElementById("answer").style.display = "none";
  document.getElementById("answer").textContent = "";
  document.getElementById("status").textContent = "JAWAB DI KOMENTAR!";
  document.getElementById("level").textContent =
    "LEVEL - " + document.getElementById("difficulty").value.toUpperCase();

  resetTimer();
}

function nextQuestion() {
  current++;
  displayQuestion();
}

function showAnswer() {
  const result = getQuestions()[current];
  document.getElementById("answer").textContent =
    "JAWABAN: " + result.a;

  document.getElementById("answer").style.display = "block";
  document.getElementById("status").textContent = "PEMBAHASAN JAWABAN";
  clearInterval(interval);
}

function resetTimer() {
  clearInterval(interval);
  seconds = 20;
  document.getElementById("timer").textContent = seconds;
}

function startTimer() {
  clearInterval(interval);

  if (seconds <= 0) seconds = 20;

  interval = setInterval(() => {
    seconds--;
    document.getElementById("timer").textContent = seconds;

    if (seconds <= 0) {
      clearInterval(interval);
      document.getElementById("status").textContent = "WAKTU HABIS!";
    }
  },1000);
}

function addScore() {
  const name = document.getElementById("player").value.trim();

  if (!name) {
    alert("Masukkan nama peserta!");
    return;
  }

  playerStreak[name] = (playerStreak[name] || 0) + 1;

  let bonus = 0;

  if (playerStreak[name] === 2) bonus = 5;
  if (playerStreak[name] === 3) bonus = 10;
  if (playerStreak[name] >= 4) bonus = 15;

  const points = 10 + bonus;

  participants[name] = (participants[name] || 0) + points;
  totalScore += points;

  document.getElementById("score").textContent =
    "TOTAL SKOR: " + totalScore;

  alert(
    name + " mendapatkan " + points +
    " poin!\n🔥 STREAK: " + playerStreak[name]
  );

  renderPlayers();
}
function renderPlayers() {
  const list = document.getElementById("playerList");
  const ranking = document.getElementById("rankingList");

  list.innerHTML = "";
  ranking.innerHTML = "";

  const sortedPlayers = Object.entries(participants)
    .sort((a, b) => b[1] - a[1]);

  sortedPlayers.forEach(([name, score], index) => {
    const item = document.createElement("div");
    item.style.padding = "8px";
    item.textContent = name + " : " + score + " POIN";
    list.appendChild(item);

    const rank = document.createElement("p");
    rank.textContent =
      (index + 1) + ". " + name + " — " + score + " POIN";

    ranking.appendChild(rank);
  });

  if (sortedPlayers.length === 0) {
    ranking.innerHTML = "<p>Belum ada peserta.</p>";
  }
}
displayQuestion();
  
function toggleLiveMode() {
  document.body.classList.toggle("live-mode");

  const button = document.getElementById("hostToggle");

  if (document.body.classList.contains("live-mode")) {
    button.textContent = "⚙️ BUKA PANEL HOST";
  } else {
    button.textContent = "🎮 AKTIFKAN LIVE MODE";
  }
}
 
function toggleFullscreen() {
  const btn = document.getElementById("fullscreenBtn");

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen()
      .then(() => {
        btn.textContent = "⛶ KELUAR FULLSCREEN";
      })
      .catch(() => {
        alert("Fullscreen tidak didukung browser ini.");
      });
  } else {
    document.exitFullscreen();
    btn.textContent = "⛶ FULLSCREEN";
  }
}

document.addEventListener("fullscreenchange", () => {
  const btn = document.getElementById("fullscreenBtn");

  btn.textContent = document.fullscreenElement
    ? "⛶ KELUAR FULLSCREEN"
    : "⛶ FULLSCREEN";
});
 

</script>

</body>
</html>
